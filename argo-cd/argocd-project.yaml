apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubeflow-project
  namespace: argocd
spec:
  description: A project for deploying kubeflow charts
  sourceRepos:
    - https://github.com/prasadzende/kubeflow.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'