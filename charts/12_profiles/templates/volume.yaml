metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  name: volumes-web-app-parameters-57h65c44mg
  namespace: kubeflow
---
apiVersion: v1
data:
  viewer-spec.yaml: "# Note: the volumes-web-app allows expanding strings using ${VAR_NAME}\r\n#
    You may use any environment variable. This lets us e.g. specify images that can
    be modified using kustomize's image transformer.\r\n# Additionally, 'PVC_NAME',
    'NAME' and 'NAMESPACE' are defined\r\n# Name of the pvc is set by the volumes
    web app\r\npvc: $NAME\r\npodSpec:\r\n  serviceAccountName: default-editor\r\n
    \ containers:\r\n    - name: main\r\n      image: $VOLUME_VIEWER_IMAGE\r\n      env:\r\n
    \       - name: FB_ADDRESS\r\n          value: \"0.0.0.0\"\r\n        - name:
    FB_PORT\r\n          value: \"8080\"\r\n        - name: FB_DATABASE\r\n          value:
    /tmp/filebrowser.db\r\n        - name: FB_NOAUTH\r\n          value: \"true\"\r\n
    \       - name: FB_BASEURL\r\n          value: /pvcviewers/$NAMESPACE/$NAME/\r\n
    \     readinessProbe:\r\n        tcpSocket:\r\n          port: 8080\r\n        initialDelaySeconds:
    2\r\n        periodSeconds: 10\r\n      # viewer-volume is provided automatically
    by the volumes web app\r\n      volumeMounts:\r\n        - name: viewer-volume\r\n
    \         mountPath: /srv\r\n      workingDir: /srv\r\n      securityContext:\r\n
    \       allowPrivilegeEscalation: false\r\n        capabilities:\r\n          drop:\r\n
    \           - ALL\r\n  volumes:\r\n    - name: viewer-volume\r\n      persistentVolumeClaim:\r\n
    \       claimName: $NAME\r\nnetworking:\r\n  targetPort: 8080\r\n  basePrefix:
    \"/pvcviewers\"\r\n  rewrite: \"/\"\r\n  timeout: 30s\r\nrwoScheduling: true\r\n"
kind: ConfigMap
metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  name: volumes-web-app-viewer-spec-7g5t7bmf7k
  namespace: kubeflow
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
    run: volumes-web-app
  name: volumes-web-app-service
  namespace: kubeflow
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 5000
  selector:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  name: volumes-web-app-deployment
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volumes-web-app
      kustomize.component: volumes-web-app
  template:
    metadata:
      labels:
        app: volumes-web-app
        kustomize.component: volumes-web-app
    spec:
      containers:
      - env:
        - name: APP_PREFIX
          value: /volumes
        - name: USERID_HEADER
          value: kubeflow-userid
        - name: USERID_PREFIX
          value: ""
        - name: APP_SECURE_COOKIES
          value: "true"
        - name: VOLUME_VIEWER_IMAGE
          value: filebrowser/filebrowser:v2.25.0
        image: docker.io/kubeflownotebookswg/volumes-web-app:v1.9.2
        name: volumes-web-app
        ports:
        - containerPort: 5000
        volumeMounts:
        - mountPath: /etc/config/viewer-spec.yaml
          name: viewer-spec
          subPath: viewer-spec.yaml
      serviceAccountName: volumes-web-app-service-account
      volumes:
      - configMap:
          name: volumes-web-app-viewer-spec-7g5t7bmf7k
        name: viewer-spec
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  name: volumes-web-app
  namespace: kubeflow
spec:
  host: volumes-web-app-service.kubeflow.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  name: volumes-web-app-volumes-web-app
  namespace: kubeflow
spec:
  gateways:
  - kubeflow-gateway
  hosts:
  - '*'
  http:
  - headers:
      request:
        add:
          x-forwarded-prefix: /volumes
    match:
    - uri:
        prefix: /volumes/
    rewrite:
      uri: /
    route:
    - destination:
        host: volumes-web-app-service.kubeflow.svc.cluster.local
        port:
          number: 80
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  name: volumes-web-app
  namespace: kubeflow
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
  selector:
    matchLabels:
      app: volumes-web-app
