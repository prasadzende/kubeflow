metadata:
  name: oauth2-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cluster-jwks-proxy
  name: cluster-jwks-proxy
  namespace: istio-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
---
apiVersion: v1
data:
  oauth2_proxy.cfg: "provider = \"oidc\"\r\noidc_issuer_url = \"http://dex.auth.svc.cluster.local:5556/dex\"\r\nscope
    = \"profile email groups openid\"\r\nemail_domains = [ \"*\" ]\r\n\r\n# serve
    a static HTTP 200 upstream on for authentication success\r\n# we are using oauth2-proxy
    as an ExtAuthz to \"check\" each request, not pass it on\r\nupstreams = [ \"static://200\"
    ]\r\n\r\n# skip authentication for these paths\r\nskip_auth_routes = [\r\n  \"^/dex/\",\r\n]\r\n\r\n#
    requests to paths matching these regex patterns will receive a 401 Unauthorized
    response\r\n# when not authenticated, instead of being redirected to the login
    page with a 302,\r\n# this prevents background requests being redirected to the
    login page,\r\n# and the accumulation of CSRF cookies\r\napi_routes = [\r\n  #
    Generic\r\n  # NOTE: included because most background requests contain these paths\r\n
    \ \"/api/\",\r\n  \"/apis/\",\r\n\r\n  # Kubeflow Pipelines\r\n  # NOTE: included
    because KFP UI makes MANY background requests to these paths but because they
    are\r\n  #       not `application/json` requests, oauth2-proxy will redirect them
    to the login page\r\n  \"^/ml_metadata\",\r\n]\r\n\r\n# OIDC Discovery has to
    be skipped and login url has to be provided directly\r\n# in order to enable relative
    auth redirect. Using OIDC Discovery would set\r\n# the redirect location to http://dex.auth.svc.cluster.local:5556
    in the example\r\n# installation. This address is usually not available through
    the Web Browser.\r\n# If you have a setup where dex has it's url as other than
    the in-cluster\r\n# service, this is optional.\r\nskip_oidc_discovery = true\r\nlogin_url
    = \"/dex/auth\"\r\nredeem_url = \"http://dex.auth.svc.cluster.local:5556/dex/token\"\r\noidc_jwks_url
    = \"http://dex.auth.svc.cluster.local:5556/dex/keys\"\r\n\r\n# if `false`, a sign-in
    page is displayed before starting the login flow\r\n# prevents background requests
    starting their own login flow on token expiry,\r\n# which can lead to many CSRF
    cookies, potentially exceeding the cookie limit\r\nskip_provider_button = false\r\n\r\n#
    style the sign-in page\r\nprovider_display_name = \"Dex\"\r\ncustom_sign_in_logo
    = \"/custom-theme/kubeflow-logo.svg\"\r\nbanner = \"-\"\r\nfooter = \"-\"\r\n\r\n#
    oauth2-proxy sends \"force\" by default, which causes dex to always prompt for
    login\r\n# https://github.com/dexidp/dex/pull/3086\r\nprompt = \"none\"\r\n\r\n#
    set Authorization Bearer response header. This is needed in order to\r\n# forward
    the Authorization Bearer token to Istio and enable authorization\r\n# based on
    JWT.\r\nset_authorization_header = true\r\n\r\n# set X-Auth-Request-User, X-Auth-Request-Groups,
    X-Auth-Request-Email and\r\n# X-Auth-Request-Preferred-Username. This is optional
    for Kubeflow but you\r\n# may have other services that use standard auth headers.\r\nset_xauthrequest
    = true\r\n\r\ncookie_name = \"oauth2_proxy_kubeflow\"\r\n\r\n# Dex default cookie
    expiration is 24h.\r\n# If set to 168h (default oauth2-proxy), Istio will not
    be able to use the JWT after 24h,\r\n# but oauth2-proxy will still consider the
    cookie valid.\r\n# It's possible to configure the JWT Refresh Token to enable
    longer login session.\r\ncookie_expire = \"24h\"\r\ncookie_refresh = 0\r\n\r\ncode_challenge_method
    = \"S256\"\r\n\r\nredirect_url = \"/oauth2/callback\"\r\nrelative_redirect_url
    = true"
kind: ConfigMap
metadata:
  name: oauth2-proxy-mf2khd2kc6
  namespace: oauth2-proxy
---
apiVersion: v1
data:
  ALLOW_SELF_SIGNED_ISSUER: "true"
  ENABLE_M2M_TOKENS: "true"
  EXTRA_JWT_ISSUERS: ""
  FORCE_HTTPS: "false"
